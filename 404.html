  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #0a0a0e;
      color: #f4f4f5;

      text-align: center;
      padding: 24px;
      margin: 0;
    }
    .not-found-card {
      max-width: 480px;

      padding: 48px 32px;

      font-weight: 800;
      font-family: monospace;
      color: #ff5c5c;
      letter-spacing: -2px;
      margin-bottom: 12px;
    }

      font-size: 24px;
      margin: 0 0 12px;

    }
    p {
      color: #a1a1aa;
      font-size: 14px;
      line-height: 1.6;
      margin: 0 0 28px;
    }
    .btn {
      display: inline-block;
      padding: 12px 24px;
      background: #6366f1;
      color: #ffffff;
      text-decoration: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14px;
      transition: background 0.2s ease, transform 0.2s ease;
    }
    .btn:hover {
      background: #4f46e5;
      transform: translateY(-2px);
